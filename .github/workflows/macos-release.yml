name: macOS Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build universal macOS packages
        run: npm run dist:mac

      - name: Save macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: Hablix-Desktop-macOS-${{ github.ref_name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error

      - name: Publish packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "Hablix Desktop $RELEASE_TAG" --notes "Cross-platform Hablix Desktop release."
          gh release upload "$RELEASE_TAG" dist/*.dmg dist/*.zip dist/latest*.yml --clobber
          for file in dist/*.blockmap; do
            [ -e "$file" ] || continue
            gh release upload "$RELEASE_TAG" "$file" --clobber
          done
