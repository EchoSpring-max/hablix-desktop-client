name: Linux Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Linux packages
        run: npm run dist:linux -- --${{ matrix.architecture }}

      - name: Save Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: Hablix-Desktop-Linux-${{ matrix.architecture }}-${{ github.ref_name }}
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

      - name: Publish packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "Hablix Desktop $RELEASE_TAG" --notes "Cross-platform Hablix Desktop release."
          gh release upload "$RELEASE_TAG" dist/*.AppImage dist/*.deb --clobber
