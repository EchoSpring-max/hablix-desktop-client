<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self';">
    <title>Starting Hablix Desktop</title>
    <link rel="stylesheet" href="splash.css">
  </head>
  <body>
    <main class="splash" aria-label="Hablix Desktop is starting">
      <div class="pixel-grid" aria-hidden="true"></div>
      <div class="orb orb-one" aria-hidden="true"></div>
      <div class="orb orb-two" aria-hidden="true"></div>
      <section class="content">
        <img src="assets/hablix-logo.png" alt="Hablix" class="logo">
        <div class="desktop-label">DESKTOP</div>
        <p>Opening the hotel…</p>
        <div class="loader" aria-hidden="true"><span></span></div>
      </section>
      <footer>WELCOME HOME</footer>
    </main>
  </body>
</html>
